---
# shared_roles/bootstrap — bootstrap configuration for a NanoPi host.
# The per-host site.yml selects either the initial credential or root public-key
# authentication.
#
# Prereqs (set by the host's site.yml / inventory / secrets file):
#   base_hostname        — e.g. "tailgate", "ai"
#   bootstrap_root_password — new root password
#   bootstrap_pi_password   — new pi password

# --- Hostname --------------------------------------------------------------

- name: Load bootstrap secrets
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/secrets/secrets.yml"
  no_log: true

- name: Check whether bootstrap completed
  ansible.builtin.stat:
    path: /var/lib/homelab/bootstrap-complete
  register: bootstrap_complete_marker

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: Ensure /etc/hosts has 127.0.1.1 entry for the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\b'
    line: "127.0.1.1\t{{ base_hostname }}"
    state: present

# --- SSH public key for root ----------------------------------------------

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Add SSH public key for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ bootstrap_pubkey }}"
    state: present

# --- Passwords -------------------------------------------------------------
# Hash with SHA-512 crypt via the target's openssl (3.x), so no passlib/crypt
# dependency is needed on the control machine or the target. The hash is
# generated on the target (where it'll be used) and fed to ansible.builtin.user.
# Passwords go to openssl on stdin (-stdin) so they never appear in process
# arguments, where local processes could observe them during provisioning.

- name: Generate root password hash (on target)
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ base_hostname }}-root", -stdin]
    stdin: "{{ bootstrap_root_password }}"
  register: bootstrap_root_hash
  changed_when: false
  no_log: true

- name: Set root password
  ansible.builtin.user:
    name: root
    password: "{{ bootstrap_root_hash.stdout }}"
  no_log: true

- name: Generate pi password hash (on target)
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ base_hostname }}-pi", -stdin]
    stdin: "{{ bootstrap_pi_password }}"
  register: bootstrap_pi_hash
  changed_when: false
  no_log: true

- name: Set pi password
  ansible.builtin.user:
    name: pi
    password: "{{ bootstrap_pi_hash.stdout }}"
  no_log: true

# Remaining tasks connected as pi need its new sudo password. Replace the
# play's bootstrap become password.
- name: Switch sudo password to the new pi password for remaining tasks
  ansible.builtin.set_fact:
    ansible_become_password: "{{ bootstrap_pi_password }}"
  no_log: true

# --- apt update + upgrade --------------------------------------------------

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
  register: bootstrap_apt_upgrade

- name: Determine whether the host requires a reboot
  ansible.builtin.set_fact:
    bootstrap_reboot_required: >-
      {{ not bootstrap_complete_marker.stat.exists or bootstrap_apt_upgrade.changed }}

# --- Base packages ---------------------------------------------------------

- name: Install base packages
  ansible.builtin.package:
    name: "{{ bootstrap_packages }}"
    state: present

# --- journald -> volatile RAM (saves SD card) ------------------------------

- name: Configure journald for volatile storage
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# --- sshd hardening ----------------------------------------------------------
# Root login is key-only; password auth stays enabled. Ordered after the
# pubkey and password tasks so access is never narrowed before the
# replacement credentials are in place.

- name: Ensure /etc/ssh/sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add sshd hardening config
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart sshd
