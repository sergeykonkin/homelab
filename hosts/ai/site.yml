---
# ai host configuration. Installs Docker with fuse-overlayfs for the NanoPi
# overlay-root.
#
# Usage:
#   cd hosts/ai
#   ansible-playbook site.yml

- name: Select ai connection
  import_playbook: ../../roles/bootstrap/playbook.yml
  vars:
    bootstrap_inventory_group: ai_hosts

- name: Set up ai Docker host
  hosts: ai_hosts
  become: true
  roles:
    - bootstrap
    - docker
  tasks:
    - name: Finalize ai host configuration
      ansible.builtin.include_role:
        name: bootstrap
        tasks_from: finalize
