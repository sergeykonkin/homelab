---
# litellm role — deploy the LiteLLM proxy app to /opt/litellm on the ai host.
#
# Depends on: shared/docker role having run (docker + fuse-overlayfs installed).
#
# `litellm` here is the app, not a host. The host is `ai`.
#
# Vault vars (from secrets/vault.yml):
#   vault_nebius_api_key, vault_litellm_master_key,
#   vault_postgres_password, vault_tls_crt, vault_tls_key
#
# config.yaml is NOT deployed — it's generated at runtime by the
# models-updater sidecar from the Nebius API.

# --- Directories -----------------------------------------------------------

- name: Ensure deploy and certs directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ litellm_deploy_path }}"
    - "{{ litellm_certs_path }}"

# --- App files (copy from role files/) ------------------------------------

- name: Copy Dockerfile.models-updater
  ansible.builtin.copy:
    src: Dockerfile.models-updater
    dest: "{{ litellm_deploy_path }}/Dockerfile.models-updater"
    owner: root
    group: root
    mode: "0644"

- name: Copy update_config.py
  ansible.builtin.copy:
    src: update_config.py
    dest: "{{ litellm_deploy_path }}/update_config.py"
    owner: root
    group: root
    mode: "0644"

- name: Copy entrypoint.sh (executable)
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: "{{ litellm_deploy_path }}/entrypoint.sh"
    owner: root
    group: root
    mode: "0755"

# --- TLS cert + key (both from vault, kept as a pair) -----------------------
# The cert isn't a secret, but keeping it with the key in the vault means the
# pair lives in one place, can't drift apart in the tree, and rotates together.

- name: Write TLS certificate (from vault)
  ansible.builtin.copy:
    dest: "{{ litellm_certs_path }}/tls.crt"
    content: "{{ vault_tls_crt }}\n"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Write TLS private key (from vault)
  ansible.builtin.copy:
    dest: "{{ litellm_certs_path }}/tls.key"
    content: "{{ vault_tls_key }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- .env (from vault) -----------------------------------------------------

- name: Write .env (from vault)
  ansible.builtin.copy:
    dest: "{{ litellm_deploy_path }}/.env"
    content: |
      NEBIUS_API_KEY={{ vault_nebius_api_key }}
      LITELLM_MASTER_KEY={{ vault_litellm_master_key }}
      POSTGRES_PASSWORD={{ vault_postgres_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- docker-compose.yml (templated) ---------------------------------------

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ litellm_deploy_path }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# --- Bring the stack up ----------------------------------------------------
# Use the host's docker CLI via the command module (no Python Docker SDK
# needed on the target). --build rebuilds the models-updater image if its
# Dockerfile/scripts changed.

- name: Build and start the LiteLLM stack
  ansible.builtin.command:
    argv: [docker, compose, up, -d, --build]
    chdir: "{{ litellm_deploy_path }}"
  register: litellm_compose_up
  changed_when: "'Started' in (litellm_compose_up.stdout | default('')) or 'Creating' in (litellm_compose_up.stdout | default(''))"
  failed_when: litellm_compose_up.rc != 0
  environment:
    # .env is auto-loaded by docker compose from the chdir; nothing to pass.
    COMPOSE_FILE: "{{ litellm_deploy_path }}/docker-compose.yml"
