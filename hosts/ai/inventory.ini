# ai — a FriendlyElec NanoPi Zero2 running the LiteLLM proxy app.
#
# The machine is `ai` (OS hostname `ai`, DNS `ai.home.arpa`); that's what
# Ansible manages it as. The LiteLLM app serves `litellm.home.arpa` (a separate
# DNS alias, also pointing at this box) as its public TLS endpoint — that's an
# app concern, not a host concern, and is handled by the `litellm` role's cert.
#
# The group is named ai_hosts (not [ai]) to avoid colliding with the host
# name `ai` — Ansible warns when a group and host share a name.

[ai_hosts]
ai ansible_host=ai.home.arpa ansible_user=root

[ai_hosts:vars]
# Consumed by shared/firstboot (OS hostname setting).
base_hostname=ai
# Pin to the unversioned system python3 symlink so the interpreter doesn't shift
# if another Python is installed (silences ansible_python_interpreter discovery
# warning). /usr/bin/python3 tracks the distro default across upgrades.
ansible_python_interpreter=/usr/bin/python3
