---
# tailscale role — install Tailscale, enable IP forwarding, bring the node up
# as a subnet router advertising the VLAN subnets.

# --- Install Tailscale (official apt repo) --------------------------------

- name: Install Tailscale from the official apt repo
  block:
    - name: Add Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
        owner: root
        group: root
        force: true

    - name: Add Tailscale apt repository (deb822)
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: ["https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}"]
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
        enabled: true
        # deb822_repository needs the Python `debian` library, which isn't on the
        # stock NanoPi image. Let the module apt-install python3-debian itself.
        install_python_debian: true

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        # Refresh the cache so the just-added tailscale apt repo is visible to
        # this install task (deb822_repository does not refresh it for us).
        update_cache: true

# --- IP forwarding (required for subnet routing) ---------------------------

- name: Enable IPv4 forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
    state: present

- name: Enable IPv6 forwarding
  ansible.builtin.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    reload: true
    state: present

# --- Ensure tailscaled is running -----------------------------------------

- name: Ensure tailscaled is enabled and started
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

# --- Bring the node up as a subnet router ----------------------------------
# Reapply the advertised routes with --reset=false and --accept-routes. This
# task does not inspect the previous preferences and always reports changed.
# --accept-routes lets this node honor routes advertised by other nodes.
#
# The advertised routes must be APPROVED in the Tailscale admin console
# (one-time, manual). The playbook advertises them; approval makes them usable
# by the tailnet, without selecting a primary router here.

- name: Compose advertised routes argument
  ansible.builtin.set_fact:
    tailscale_routes_arg: "{{ tailscale_advertise_routes | join(',') }}"

- name: Bring Tailscale up as a subnet router
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --advertise-routes={{ tailscale_routes_arg }}
      - --auth-key={{ tailscale_authkey }}
      - --reset=false
      - --accept-routes
  register: tailscale_up_result
  # Report changed unconditionally; any non-zero exit is a failure.
  changed_when: true
  failed_when: tailscale_up_result.rc != 0
  no_log: true  # auth key is in the command

# --- Auto-update -----------------------------------------------------------
# Auto-update is a node-level pref, set with `tailscale set --auto-update`.
# False skips this task; it does not disable an already-enabled preference.

- name: Enable Tailscale auto-update
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--auto-update={{ tailscale_auto_update | lower }}"
  changed_when: false
  when: tailscale_auto_update | bool
