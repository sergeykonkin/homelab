[defaults]
# Per-host ansible project. Run from inside this directory:
#   ansible-playbook site.yml
# No top-level inventory; this folder is self-contained.

inventory = ./inventory.ini
# Roles resolve from the repo-root roles/ dir AND this host's colocated ./roles/.
# `cd hosts/tailgate && ansible-playbook ...` makes ../../roles resolve to homelab/roles.
roles_path = ../../roles:./roles

# Vault password lives in the repo-root, gitignored file.
vault_password_file = ../../.vault-pass

# A freshly-burned host isn't in known_hosts yet.
host_key_checking = False
