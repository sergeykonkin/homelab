---
# tailgate playbook — real setup, re-runnable anytime after bootstrap.
# Installs Tailscale and brings the node up as a subnet router.
#
# Usage:
#   cd hosts/tailgate
#   ansible-playbook site.yml
#
# Prereq: bootstrap.yml has run (key auth works; hostname/DNS is set).
# Prereq: tailscale auth key in secrets/vault.yml (vault_tailscale_authkey).
# Manual one-time: approve the advertised routes in the Tailscale admin console.

- name: Set up tailgate as a Tailscale subnet router
  hosts: tailgate_hosts
  become: true
  vars_files:
    - secrets/vault.yml
  # Steady-state: key auth as root, inventory ansible_host = tailgate.home.arpa.
  vars:
    ansible_user: root
  roles:
    - tailscale
