---
# Tailgate host configuration. Installs Tailscale and brings the node up as a
# subnet router.
#
# Usage:
#   cd hosts/tailgate
#   ansible-playbook site.yml
# Prereq: tailscale auth key in secrets/vault.yml (vault_tailscale_authkey).
# Manual one-time: approve the advertised routes in the Tailscale admin console.

- name: Select tailgate connection
  import_playbook: ../../roles/bootstrap/playbook.yml
  vars:
    bootstrap_inventory_group: tailgate_hosts

- name: Set up tailgate as a Tailscale subnet router
  hosts: tailgate_hosts
  become: true
  vars_files:
    - secrets/vault.yml
  roles:
    - bootstrap
    - tailscale
  tasks:
    - name: Finalize tailgate host configuration
      ansible.builtin.include_role:
        name: bootstrap
        tasks_from: finalize
