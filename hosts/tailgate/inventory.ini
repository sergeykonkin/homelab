# tailgate — Tailscale subnet router on a FriendlyElec NanoPi Zero2.
# Steady-state (post-bootstrap) connection: root via SSH key.
# ansible_host is the DNS name served by the gateway.
#
# The group is named tailgate_hosts (not [tailgate]) to avoid colliding with
# the host name `tailgate` — Ansible warns when a group and host share a name.

[tailgate_hosts]
tailgate ansible_host=tailgate.home.arpa ansible_user=root

[tailgate_hosts:vars]
# Host var consumed by roles/bootstrap (hostname setting).
base_hostname=tailgate
# Pin to the unversioned system python3 symlink so the interpreter doesn't shift
# if another Python is installed (silences ansible_python_interpreter discovery
# warning). /usr/bin/python3 tracks the distro default across upgrades.
ansible_python_interpreter=/usr/bin/python3
