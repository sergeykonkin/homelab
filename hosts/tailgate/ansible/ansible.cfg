[defaults]
# Per-host ansible project. Run from inside this directory:
#   ansible-playbook site.yml
# No top-level inventory; this folder is self-contained.

inventory = ./inventory.ini
# Roles resolve from the repo-root shared_roles/ dir AND this host's colocated ./roles/.
# `cd hosts/tailgate/ansible && ansible-playbook ...` resolves ../../../shared_roles
# to the repository's shared roles directory.
roles_path = ../../../shared_roles:./roles

# Vault password lives in the repo-root, gitignored file.
vault_password_file = ../../../.vault-pass

# A freshly-burned host isn't in known_hosts yet.
host_key_checking = False
