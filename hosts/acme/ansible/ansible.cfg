[defaults]
# Per-host ansible project. Run from inside this directory:
#   ansible-playbook site.yml
# No top-level inventory; this folder is self-contained.

inventory = ./inventory.ini
# Roles resolve from repo-root shared_roles/ AND this host's colocated ./roles/.
roles_path = ../../../shared_roles:./roles

# A freshly-burned host isn't in known_hosts yet.
host_key_checking = False
