# acme — a FriendlyElec NanoPi Zero2 Docker host for the ACME-DNS gateway.
#
# The machine is `acme` (OS hostname `acme`, DNS `acme.home.arpa`); Ansible
# manages the host configuration. Workloads use the `acme` Docker context.
#
# The group is named acme_hosts (not [acme]) to avoid colliding with the host
# name `acme` — Ansible warns when a group and host share a name.

[acme_hosts]
acme ansible_host=acme.home.arpa ansible_user=root

[acme_hosts:vars]
# Consumed by roles/bootstrap (OS hostname setting).
base_hostname=acme
# Pin to the unversioned system python3 symlink so the interpreter doesn't shift
# if another Python is installed (silences ansible_python_interpreter discovery
# warning). /usr/bin/python3 tracks the distro default across upgrades.
ansible_python_interpreter=/usr/bin/python3
