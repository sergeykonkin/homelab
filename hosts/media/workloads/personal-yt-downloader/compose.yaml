name: personal-yt-downloader

services:
  app:
    image: ghcr.io/sergeykonkin/personal-yt-downloader:v1.1.0
    container_name: personal-yt-downloader
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PASSWORD: "${PASSWORD:?set PASSWORD}"
      API_TOKEN: "${API_TOKEN:-}"
    entrypoint:
      - /bin/sh
      - -ec
      - 'exec /usr/local/bin/server -trusted-proxies=172.30.57.2'
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - server
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      tunnel:
        ipv4_address: 172.30.57.3
      egress:
        gw_priority: 1

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: personal-yt-downloader-cloudflared
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}"
    command:
      - tunnel
      - --metrics
      - 127.0.0.1:2000
      - run
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      tunnel:
        ipv4_address: 172.30.57.2
      egress:
        gw_priority: 1

networks:
  tunnel:
    name: personal_yt_downloader_tunnel
    internal: true
    ipam:
      config:
        - subnet: 172.30.57.0/29
  egress:
    name: personal_yt_downloader_egress

volumes:
  data:
    name: personal_yt_downloader_data
