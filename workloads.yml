# Allowed deployment hosts, keyed by Compose workload.
#
# required_files must exist decrypted before `make apply`. copy_files are
# additionally provisioned to /opt/<workload>/ on the target host, preserving
# their workload-relative paths (root-owned, directories 0700, files 0400), and
# Compose reaches them through COPY_DIR. The indirection exists because
# bind-mount and `secrets: file:` paths resolve on the client and do not cross
# SSH Docker contexts. Updating copy_files contents does not recreate
# containers; restart the affected container to reload secret-bearing
# processes.
workloads:
  acme-dns-gateway:
    allowed_hosts:
      - acme
    required_files:
      - .env
      - secrets/gateway.json
      - secrets/caddy-acmedns.json
    copy_files:
      - secrets/gateway.json
      - secrets/caddy-acmedns.json
  caddy:
    allowed_hosts:
      - ai
    required_files:
      - .env
      - secrets/caddy-acmedns.json
    copy_files:
      - secrets/caddy-acmedns.json
  litellm:
    allowed_hosts:
      - ai
    required_files:
      - .env
