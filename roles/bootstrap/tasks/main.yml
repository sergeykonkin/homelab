---
# roles/bootstrap — bootstrap configuration for a NanoPi host.
# The per-host bootstrap.yml connects using the fresh-image credential when
# needed, or root public-key authentication after root access is configured.
#
# Prereqs (set by the host's bootstrap.yml / inventory / vault):
#   base_hostname        — e.g. "tailgate", "ai"
#   vault_root_pw        — new root password (vault)
#   vault_pi_pw          — new pi password (vault)

# --- Hostname --------------------------------------------------------------

- name: Load bootstrap vault
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/secrets/vault.yml"
  no_log: true

- name: Check whether bootstrap completed
  ansible.builtin.stat:
    path: /var/lib/homelab/bootstrap-complete
  register: bootstrap_complete_marker

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"

- name: Ensure /etc/hosts has 127.0.1.1 entry for the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\b'
    line: "127.0.1.1\t{{ base_hostname }}"
    state: present

# --- SSH public key for root ----------------------------------------------

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Add SSH public key for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ bootstrap_pubkey }}"
    state: present

# --- Passwords -------------------------------------------------------------
# Hash with SHA-512 crypt via the target's openssl (3.x), so no passlib/crypt
# dependency is needed on the control machine or the target. The hash is
# generated on the target (where it'll be used) and fed to ansible.builtin.user.

- name: Generate root password hash (on target)
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ base_hostname }}-root", "{{ vault_root_pw }}"]
  register: bootstrap_root_hash
  changed_when: false
  no_log: true

- name: Set root password
  ansible.builtin.user:
    name: root
    password: "{{ bootstrap_root_hash.stdout }}"
  no_log: true

- name: Generate pi password hash (on target)
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -salt, "{{ base_hostname }}-pi", "{{ vault_pi_pw }}"]
  register: bootstrap_pi_hash
  changed_when: false
  no_log: true

- name: Set pi password
  ansible.builtin.user:
    name: pi
    password: "{{ bootstrap_pi_hash.stdout }}"
  no_log: true

# Remaining tasks connected as pi need its new sudo password. Replace the
# play's bootstrap become password; the reboot task below switches to root
# key auth and does not depend on pi's sudo credentials.
- name: Switch sudo password to the new pi password for remaining tasks
  ansible.builtin.set_fact:
    ansible_become_password: "{{ vault_pi_pw }}"
  no_log: true

# --- apt update + upgrade --------------------------------------------------

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: true
  register: bootstrap_apt_upgrade

# --- Base packages ---------------------------------------------------------

- name: Install base packages
  ansible.builtin.package:
    name: "{{ bootstrap_packages }}"
    state: present

# --- journald -> volatile RAM (saves SD card) ------------------------------

- name: Configure journald for volatile storage
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

# --- sshd hardening (key-only auth) ----------------------------------------
# Done AFTER the key is dropped and AFTER passwords are changed, so we never
# lock ourselves out: by the time password auth is disabled, the pubkey is in
# place and the new passwords are set (for console/serial access).

- name: Ensure /etc/ssh/sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add sshd hardening config (key-only auth)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and restart sshd

# --- Completion and reboot -------------------------------------------------
# Flush handlers so sshd validation+restart happens before the reboot.
- name: Flush handlers (apply sshd/journald changes before reboot)
  ansible.builtin.meta: flush_handlers

- name: Record completed bootstrap configuration
  ansible.builtin.file:
    path: /var/lib/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create bootstrap completion marker
  ansible.builtin.file:
    path: /var/lib/homelab/bootstrap-complete
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Reboot to complete bootstrap
  ansible.builtin.reboot:
    reboot_timeout: 300
    test_command: whoami
  when: not bootstrap_complete_marker.stat.exists or bootstrap_apt_upgrade.changed
