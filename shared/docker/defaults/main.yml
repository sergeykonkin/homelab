---
# shared/docker defaults

# The NanoPi Zero2 root filesystem is itself an overlayfs (overlay-root).
# Docker's default `overlay2` driver fails to nest on it, so we force
# fuse-overlayfs.
docker_storage_driver: fuse-overlayfs

# No shared external Docker network is created. When a second app joins the
# host (e.g. open-webui), add a shared external network here and create it
# idempotently in tasks/main.yml — and update the app compose files to use it.
