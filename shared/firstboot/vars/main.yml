---
# Packages to install on first boot.
firstboot_packages:
  - nano
  - curl

# journald: move logs to volatile RAM to spare the SD card.
firstboot_journald_storage: volatile
firstboot_journald_system_max_use: 256M

# SSH public key dropped into /root/.ssh/authorized_keys by this role.
firstboot_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBRzjnZwOOxhxOuIFvKK60a3Fl07agbMMxCzHrp5aPOT srj@macbook-air-m4"

# Default image credential for a freshly-burned NanoPi Zero2.
# Not a secret — it's the public default. Overridden at the play level in firstboot.yml.
# pi:pi logs in as the unprivileged user; the play runs `become: true` with this
# same password to act as root via sudo.
firstboot_default_user: pi
firstboot_default_password: pi
